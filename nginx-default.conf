# Reemplaza el default.conf de la imagen nginx:alpine.
# IMPORTANTE: en la imagen oficial, /var/log/nginx/access.log es un symlink a
# /dev/stdout, así que Fail2Ban (que corre como otro proceso dentro del mismo
# contenedor) no puede "tail -f" ese archivo de forma confiable. Por eso se
# define aquí un segundo access_log que SÍ es un archivo regular en disco.
log_format f2b '$remote_addr - - [$time_local] "$request" $status';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;        # el de siempre (va a stdout)
    access_log /var/log/nginx/fail2ban.log f2b;   # el que vigila Fail2Ban

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
