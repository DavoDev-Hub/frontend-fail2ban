<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis favoritos · Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="centered">
    <main class="card narrow">
        <h1>Mis favoritos</h1>
        <p class="muted">Inicia sesión con tu usuario de LDAP</p>

        <form id="loginForm">
            <label>Usuario
                <input id="username" type="text" placeholder="alice" autocomplete="username" required>
            </label>
            <label>Contraseña
                <input id="password" type="password" placeholder="alice123" autocomplete="current-password" required>
            </label>
            <button type="submit">Iniciar sesión</button>
            <p id="error" class="error"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
